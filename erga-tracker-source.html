<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Έργα — Οικονομική παρακολούθηση</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Sans', sans-serif; background: #EDEAE1; color: #221F1A; min-height: 100vh; }
  .disp { font-family: 'Space Grotesk', sans-serif; }
  .num { font-variant-numeric: tabular-nums; }
  button { cursor: pointer; font-family: inherit; border: none; background: none; }
  input, select { font-family: inherit; }
  ::placeholder { color: #A8A493; }

  #app { display: flex; min-height: 100vh; }
  #sidebar { width: 260px; border-right: 1px solid #D8D3C5; display: flex; flex-direction: column; flex-shrink: 0; }
  #sidebarHeader { padding: 22px 20px 16px; border-bottom: 1px solid #D8D3C5; display: flex; align-items: center; gap: 9px; }
  #sidebarHeader .mark { width: 30px; height: 30px; background: #C1571F; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #F8F6F1; font-size: 15px; }
  #sidebarHeader .title { font-size: 16px; font-weight: 600; line-height: 1.1; }
  #sidebarHeader .sub { font-size: 11px; color: #8A8676; }

  #projectList { flex: 1; overflow-y: auto; padding: 10px; }
  .project-item { display: block; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 3px; border-radius: 3px; }
  .project-item:hover { background: #E4E0D4; }
  .project-item.active { background: #221F1A; color: #F8F6F1; }
  .project-item .code { font-size: 11px; color: #8A8676; margin-bottom: 2px; }
  .project-item.active .code { color: #C9C5B8; }
  .project-item .name { font-size: 13.5px; font-weight: 500; margin-bottom: 4px; }
  .project-item .pl { font-size: 12px; }
  .project-item .pl.pos { color: #2F6B4F; }
  .project-item .pl.neg { color: #A6402C; }
  .project-item.active .pl.pos { color: #8FCBA8; }
  .project-item.active .pl.neg { color: #E8A399; }
  .empty-note { padding: 16px 12px; font-size: 12.5px; color: #8A8676; line-height: 1.5; }

  #sidebarFooter { padding: 14px; border-top: 1px solid #D8D3C5; }
  .btn-outline { width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 12px; border: 1px solid #221F1A; border-radius: 3px; font-size: 13px; font-weight: 500; }
  .btn-outline:hover { background: #E4E0D4; }

  #main { flex: 1; min-width: 0; padding: 26px 34px; overflow-y: auto; }
  .page-title { font-size: 24px; font-weight: 600; margin-bottom: 4px; }
  .page-sub { font-size: 13.5px; color: #6E6A5F; margin-bottom: 26px; }

  #statBar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: #D8D3C5; }
  .stat-card { background: #F8F6F1; padding: 16px 18px; }
  .stat-card .row { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .stat-card .label { font-size: 11.5px; color: #6E6A5F; }
  .stat-card .value { font-size: 21px; font-weight: 600; margin-bottom: 4px; }
  .stat-card .value.pos { color: #2F6B4F; }
  .stat-card .value.neg { color: #A6402C; }
  .stat-card .foot { font-size: 11px; color: #8A8676; }

  .header-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .proj-name { font-size: 24px; font-weight: 600; margin-bottom: 3px; }
  .proj-meta { font-size: 13px; color: #6E6A5F; }
  .btn-danger { display: flex; align-items: center; gap: 5px; border: 1px solid #D8D3C5; border-radius: 3px; padding: 7px 11px; font-size: 12.5px; color: #8A3319; }
  .btn-danger:hover { background: #E4E0D4; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin: 30px 0 12px; }
  .filter-group { display: flex; gap: 4px; }
  .filter-btn { padding: 6px 13px; font-size: 12.5px; font-weight: 500; border: 1px solid #D8D3C5; border-radius: 3px; background: transparent; }
  .filter-btn.active { background: #221F1A; color: #F8F6F1; }
  .action-group { display: flex; gap: 8px; }
  .btn-income { display: flex; align-items: center; gap: 6px; padding: 8px 13px; border: 1px solid #2F6B4F; color: #2F6B4F; border-radius: 3px; font-size: 12.5px; font-weight: 500; }
  .btn-expense { display: flex; align-items: center; gap: 6px; padding: 8px 13px; border: 1px solid #C1571F; background: #C1571F; color: #F8F6F1; border-radius: 3px; font-size: 12.5px; font-weight: 500; }
  .btn-expense:hover { background: #A8481A; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #entriesWrap { border: 1px solid #D8D3C5; background: #F8F6F1; overflow-x: auto; }
  th { text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 500; color: #8A8676; border-bottom: 1px solid #D8D3C5; white-space: nowrap; }
  th.right, td.right { text-align: right; }
  td { padding: 10px 14px; border-bottom: 1px solid #EBE8DE; }
  tbody tr:hover { background: #F1EEE6; }
  .desc-main { font-weight: 500; }
  .desc-sub { font-size: 11px; color: #8A8676; }
  .amt-pos { font-weight: 600; color: #2F6B4F; }
  .amt-neg { font-weight: 600; color: #A6402C; }
  .status-btn { font-size: 11px; padding: 3px 9px; border-radius: 3px; border: 1px solid; white-space: nowrap; }
  .status-paid { border-color: #B9D4C4; background: #E7F2EC; color: #2F6B4F; }
  .status-pending { border-color: #E0D5A8; background: #FBF3DC; color: #8A6D1E; }
  .del-btn { color: #B0AB98; font-size: 16px; }
  .empty-table { border: 1px solid #D8D3C5; background: #F8F6F1; padding: 40px 20px; text-align: center; color: #8A8676; font-size: 13px; }

  .chart-section { margin: 30px 0; }
  .chart-title { font-size: 13px; font-weight: 500; color: #6E6A5F; margin-bottom: 10px; }
  .chart-box { background: #F8F6F1; border: 1px solid #D8D3C5; padding: 18px; height: 280px; }
  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  .save-err { background: #FBEAE7; border: 1px solid #E8B7A9; color: #8A3319; font-size: 12.5px; padding: 8px 12px; border-radius: 3px; margin-bottom: 16px; }
  .loading-note { color: #8A8676; font-size: 13px; padding: 20px 0; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(34,31,26,0.45); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal-box { background: #F8F6F1; width: 420px; max-width: 100%; max-height: 88vh; overflow-y: auto; border: 1px solid #D8D3C5; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #D8D3C5; }
  .modal-title { font-size: 16px; font-weight: 600; }
  .modal-close { color: #8A8676; font-size: 18px; }
  .modal-body { padding: 20px; }
  .field { margin-bottom: 14px; }
  .field label { font-size: 11.5px; color: #6E6A5F; margin-bottom: 5px; display: block; }
  .field input, .field select { width: 100%; padding: 9px 11px; border: 1px solid #D8D3C5; border-radius: 3px; font-size: 13.5px; background: #FFFFFF; color: #221F1A; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  #projectModalOverlay input:disabled, #projectModalOverlay select:disabled { background: #EFEBE0; color: #6E6A5F; }
  #projectModalOverlay .modal-body button:disabled { opacity: 0.35; cursor: default; }
  .total-box { display: flex; justify-content: space-between; font-size: 13px; padding: 10px 12px; background: #EFEBE0; margin-bottom: 14px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 6px; }
  .err-text { color: #A6402C; font-size: 12px; margin-top: 8px; }
  .btn-submit { margin-top: 14px; width: 100%; padding: 10px; border: none; color: #F8F6F1; border-radius: 3px; font-size: 13.5px; font-weight: 500; }

  .filter-input { padding: 6px 10px; border: 1px solid #D8D3C5; border-radius: 3px; font-size: 12.5px; background: #F8F6F1; color: #221F1A; }
  .filter-input::placeholder { color: #A8A493; }
  .filter-row2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .filter-date-label { font-size: 11.5px; color: #8A8676; }

  .vat-line-row { display: grid; grid-template-columns: 1fr 100px 28px; gap: 8px; margin-bottom: 8px; align-items: center; }
  .vat-line-row input, .vat-line-row select { padding: 8px 10px; border: 1px solid #D8D3C5; border-radius: 3px; font-size: 13px; background: #FFFFFF; color: #221F1A; width: 100%; }
  .vat-line-remove { color: #B0AB98; font-size: 16px; text-align: center; }
  .vat-line-remove:hover { color: #A6402C; }

  .alloc-row { display: grid; grid-template-columns: 1fr 80px 26px; gap: 8px; margin-bottom: 8px; align-items: center; }
  .alloc-row.single { grid-template-columns: 1fr 80px; }
  .alloc-row select, .alloc-row input { padding: 8px 9px; border: 1px solid #D8D3C5; border-radius: 3px; font-size: 13px; background: #FFFFFF; color: #221F1A; }
  .alloc-remove { color: #B0AB98; font-size: 15px; text-align: center; }
  .split-badge { font-size: 11px; color: #8A8676; }

  .tag-badge { font-size: 10.5px; padding: 2px 8px; border-radius: 10px; background: #EFEBE0; color: #6E6A5F; white-space: nowrap; display: inline-block; }
  .tag-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 5px 9px; border-radius: 12px; background: #EFEBE0; color: #221F1A; }
  .tag-chip button { color: #8A8676; font-size: 13px; line-height: 1; }
  .tag-chip button:hover { color: #A6402C; }
  .tag-input-row { display: flex; gap: 8px; }
  .tag-input-row input { flex: 1; }

  .contact-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 26px; gap: 8px; margin-bottom: 8px; align-items: center; }
  .contact-row input { padding: 8px 9px; border: 1px solid #D8D3C5; border-radius: 3px; font-size: 12.5px; background: #FFFFFF; color: #221F1A; width: 100%; }
  .contact-remove { color: #B0AB98; font-size: 15px; text-align: center; }
  .contact-remove:hover { color: #A6402C; }

  .kv-row { display: grid; grid-template-columns: 1fr 1fr auto 26px; gap: 8px; margin-bottom: 8px; align-items: center; }
  .kv-row input { padding: 8px 9px; border: 1px solid #D8D3C5; border-radius: 3px; font-size: 12.5px; background: #FFFFFF; color: #221F1A; width: 100%; }
  .kv-file-attach { font-size: 15px; color: #8A8676; padding: 4px; }
  .kv-file-attach:hover { color: #221F1A; }
  .kv-file-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 4px 8px; border-radius: 10px; background: #EFEBE0; color: #221F1A; white-space: nowrap; max-width: 140px; }
  .kv-file-chip a { color: #221F1A; text-decoration: underline; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kv-file-chip button { color: #8A8676; font-size: 12px; }
  .kv-file-chip button:hover { color: #A6402C; }
  .kv-list { font-size: 12.5px; color: #6E6A5F; }
  .kv-list .kv-item { padding: 3px 0; }
  .kv-list .kv-item b { color: #221F1A; }

  .contact-card { display: flex; flex-wrap: wrap; gap: 3px 14px; font-size: 12.5px; color: #6E6A5F; }
  .contact-card .c-name { font-weight: 600; color: #221F1A; }

  .proj-status-badge { font-size: 11px; padding: 3px 9px; border-radius: 3px; border: 1px solid; white-space: nowrap; display: inline-block; margin-top: 6px; }
  .proj-status-active { border-color: #B9D4C4; background: #E7F2EC; color: #2F6B4F; }
  .proj-status-on_hold { border-color: #E0D5A8; background: #FBF3DC; color: #8A6D1E; }
  .proj-status-completed { border-color: #C7C2E8; background: #EEECFB; color: #4B3F9E; }
  .proj-status-cancelled { border-color: #E0BDB2; background: #FBEAE7; color: #8A3319; }

  .sidebar-filter { padding: 10px 10px 0; }
  .sidebar-filter select { width: 100%; padding: 7px 9px; border: 1px solid #D8D3C5; border-radius: 3px; font-size: 12px; background: #F8F6F1; color: #221F1A; }

  .file-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px; border-bottom: 1px solid #EBE8DE; font-size: 13px; }
  .file-row:last-child { border-bottom: none; }
  .file-row a { color: #221F1A; font-weight: 500; }
  .file-row .file-meta { font-size: 11px; color: #8A8676; }

  @media print {
    .no-print { display: none !important; }
    #sidebar { display: none !important; }
    #app { display: block; }
    #main { padding: 0; overflow: visible; }
    body { background: #fff; }
  }

  @media (max-width: 720px) {
    #app { flex-direction: column; }
    #sidebar { width: 100%; border-right: none; border-bottom: 1px solid #D8D3C5; max-height: 40vh; }
    #main { padding: 18px; }
    #statBar { grid-template-columns: repeat(2, 1fr); }
    .chart-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <div id="sidebarHeader">
      <div class="mark">&#9635;</div>
      <div>
        <div class="disp title">Έργα</div>
        <div class="sub" id="projectCount">0 ενεργά</div>
      </div>
    </div>
    <div class="sidebar-filter">
      <select id="sidebarStatusFilter">
        <option value="open">Ενεργά έργα</option>
        <option value="all">Όλα τα έργα</option>
        <option value="completed">Ολοκληρωμένα</option>
        <option value="cancelled">Ακυρωμένα</option>
      </select>
    </div>
    <div id="projectList"><div class="loading-note">Φόρτωση…</div></div>
    <div id="sidebarFooter">
      <button class="btn-outline" id="allInvoicesBtn" style="margin-bottom:8px;">Όλα τα τιμολόγια</button>
      <button class="btn-outline" id="newProjectBtn">+ Νέο έργο</button>
    </div>
  </div>
  <div id="main"><div class="loading-note">Φόρτωση…</div></div>
</div>

<div class="modal-overlay" id="projectModalOverlay">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title disp" id="projectModalTitle">Νέο έργο</div>
      <button class="modal-close" data-close="projectModalOverlay">&#10005;</button>
    </div>
    <div class="modal-body">
      <div class="field" id="pjLockField" style="display:none;">
        <div class="filter-group">
          <button type="button" class="filter-btn" id="pjLockBtn">&#128274; Κλειδωμένο</button>
          <button type="button" class="filter-btn" id="pjEditBtn">&#9998; Επεξεργασία</button>
        </div>
      </div>
      <div class="field"><label>Όνομα έργου</label><input id="pjName" placeholder="π.χ. Οικοδομή Λεωφόρος Αθηνών"></div>
      <div class="field"><label>Διεύθυνση / τοποθεσία (προαιρετικό)</label><input id="pjAddress"></div>
      <div class="field-row">
        <div class="field"><label>Ημ/νία έναρξης (προαιρετικό)</label><input id="pjStartDate" type="date"></div>
        <div class="field"><label>Αναμ. ημ/νία λήξης (προαιρετικό)</label><input id="pjEndDate" type="date"></div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Κατάσταση</label>
          <select id="pjStatus">
            <option value="active">Ενεργό</option>
            <option value="on_hold">Σε αναμονή</option>
            <option value="completed">Ολοκληρωμένο</option>
            <option value="cancelled">Ακυρωμένο</option>
          </select>
        </div>
        <div class="field"><label>Προϋπολογισμός € (προαιρετικό)</label><input id="pjBudget" type="number"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>ΑΦΜ πελάτη (προαιρετικό)</label><input id="pjClientVat"></div>
        <div class="field"><label>Αριθμός συμβολαίου (προαιρετικό)</label><input id="pjContractNumber"></div>
      </div>
      <div class="field">
        <label>Επαφές έργου (π.χ. πελάτης, μηχανικός, επιβλέπων)</label>
        <div id="pjContacts"></div>
        <button type="button" id="addContactBtn" class="btn-outline" style="margin-top:2px; font-size:12px; padding:6px 10px; width:auto; display:inline-flex;">+ Προσθήκη επαφής</button>
      </div>
      <div class="field">
        <label>Επιπλέον στοιχεία (π.χ. Πολεοδομική Άδεια, Αρ. πρωτοκόλλου…) — με δυνατότητα επισύναψης αρχείου ανά γραμμή</label>
        <div id="pjFields"></div>
        <button type="button" id="addFieldBtn" class="btn-outline" style="margin-top:2px; font-size:12px; padding:6px 10px; width:auto; display:inline-flex;">+ Προσθήκη γραμμής</button>
      </div>
      <div class="err-text" id="pjError" style="display:none;"></div>
      <button class="btn-submit" style="background:#C1571F;" id="pjSubmit">Δημιουργία έργου</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="entryModalOverlay">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title disp" id="entryModalTitle">Νέο έσοδο</div>
      <button class="modal-close" data-close="entryModalOverlay">&#10005;</button>
    </div>
    <div class="modal-body">
      <div class="field" id="enProjectField">
        <label>Έργο(-α)</label>
        <div id="enProjectAllocations"></div>
        <button type="button" id="addAllocationBtn" class="btn-outline" style="margin-top:2px; font-size:12px; padding:6px 10px; width:auto; display:inline-flex;">+ Προσθήκη έργου</button>
        <div id="allocationRemaining" style="font-size:11.5px; margin-top:6px;"></div>
      </div>
      <div class="field-row" style="margin-bottom:14px;">
        <div class="field" style="margin-bottom:0;"><label>Ημερομηνία</label><input id="enDate" type="date"></div>
        <div class="field" style="margin-bottom:0;" id="enCategoryField">
          <label>Κατηγορία</label>
          <select id="enCategory"></select>
          <input id="enCategoryNew" placeholder="Νέα κατηγορία…" style="display:none; margin-top:6px;">
        </div>
      </div>
      <div class="field"><label>Περιγραφή</label><input id="enDescription" placeholder="π.χ. 2η πιστοποίηση εργασιών"></div>
      <div class="field">
        <label>Ετικέτες / Φάση έργου (προαιρετικό)</label>
        <div id="enTagsWrap" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;"></div>
        <div class="tag-input-row">
          <input id="enTagInput" list="enTagList" placeholder="π.χ. Θεμελίωση, Σκελετός…">
          <datalist id="enTagList"></datalist>
          <button type="button" id="addTagBtn" class="btn-outline" style="width:auto; padding:8px 13px; font-size:12.5px;">+ Προσθήκη</button>
        </div>
      </div>
      <div class="field" id="enSupplierField"><label>Προμηθευτής</label><input id="enSupplier" list="supplierList" placeholder="π.χ. Ελαστικά Παπαδόπουλος"></div>
      <datalist id="supplierList"></datalist>
      <div class="field"><label>Αριθμός τιμολογίου (προαιρετικό)</label><input id="enInvoice"></div>
      <div class="field"><label>Τρόπος πληρωμής</label><select id="enPaymentMethod"></select></div>
      <div class="field">
        <label>Γραμμές ΦΠΑ</label>
        <div id="vatLinesWrap"></div>
        <button type="button" class="btn-outline" id="addVatLineBtn" style="margin-top:6px; padding:7px 10px; font-size:12.5px;">+ Γραμμή με άλλο ΦΠΑ</button>
      </div>
      <div class="total-box"><span style="color:#6E6A5F;">Σύνολο με ΦΠΑ</span><span class="num" style="font-weight:600;" id="enTotalPreview">0,00 €</span></div>
      <label class="checkbox-row"><input type="checkbox" id="enPaid"><span id="enPaidLabel">Έχει εισπραχθεί</span></label>
      <div class="err-text" id="enError" style="display:none;"></div>
      <button class="btn-submit" id="enSubmit">Αποθήκευση</button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = "https://okougilqppxtptadaddg.supabase.co";
const SUPABASE_KEY = "sb_publishable_m3bHePKjmR-GsajavaTIsw_pJLQqw2f";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

function fmt(n) {
  return (Math.round((n + Number.EPSILON) * 100) / 100).toLocaleString("el-GR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function fmtDate(d) { if (!d) return "—"; const [y, m, day] = d.split("-"); return `${day}/${m}/${y}`; }
function fmtMonth(ym) {
  const [y, m] = ym.split("-");
  const names = ["Ιαν","Φεβ","Μαρ","Απρ","Μαϊ","Ιουν","Ιουλ","Αυγ","Σεπ","Οκτ","Νοε","Δεκ"];
  return names[parseInt(m,10)-1] + " " + y.slice(2);
}
function escapeHTML(s) { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }

function mapEntry(row) {
  return {
    id: row.id, projectId: row.project_id, type: row.type, date: row.date,
    description: row.description, category: row.category, net: Number(row.net),
    vatRate: Number(row.vat_rate), vat: Number(row.vat), supplier: row.supplier,
    invoiceNumber: row.invoice_number, paid: row.paid, paidDate: row.paid_date,
    paymentMethod: row.payment_method, splitGroupId: row.split_group_id,
    splitPercent: row.split_percent !== null && row.split_percent !== undefined ? Number(row.split_percent) : null,
    vatLines: row.vat_lines || null, tags: row.tags || []
  };
}
function mapProject(row) {
  return {
    id: row.id, name: row.name, address: row.address, budget: Number(row.budget || 0),
    startDate: row.start_date, endDate: row.end_date, status: row.status || "active",
    clientVat: row.client_vat, contractNumber: row.contract_number
  };
}
function mapContact(row) {
  return { id: row.id, projectId: row.project_id, name: row.name, role: row.role, phone: row.phone, email: row.email };
}
function mapField(row) {
  return {
    id: row.id, projectId: row.project_id, label: row.label, value: row.value,
    storagePath: row.storage_path, fileSize: row.file_size ? Number(row.file_size) : null,
    fileUrl: row.storage_path ? supabase.storage.from("project-files").getPublicUrl(row.storage_path).data.publicUrl : null
  };
}
function fileNameFromPath(path) {
  if (!path) return "";
  return path.split("/").pop().replace(/^\d+_/, "");
}

async function loadData() {
  loading = true;
  render();
  const [projRes, entRes, contactRes, fieldRes] = await Promise.all([
    supabase.from("projects").select("*").order("created_at", { ascending: true }),
    supabase.from("entries").select("*"),
    supabase.from("project_contacts").select("*").order("created_at", { ascending: true }),
    supabase.from("project_fields").select("*").order("sort_order", { ascending: true })
  ]);
  if (projRes.error || entRes.error || contactRes.error || fieldRes.error) {
    saveError = true;
  } else {
    projects = projRes.data.map(mapProject);
    entries = entRes.data.map(mapEntry);
    contacts = contactRes.data.map(mapContact);
    fields = fieldRes.data.map(mapField);
    if (projects.length > 0 && !activeProjectId) activeProjectId = projects[0].id;
  }
  loading = false;
  render();
}

function computeStats(list) {
  const income = list.filter(e => e.type === "income");
  const expense = list.filter(e => e.type === "expense");
  const incNet = income.reduce((s, e) => s + e.net, 0);
  const incVat = income.reduce((s, e) => s + e.vat, 0);
  const expNet = expense.reduce((s, e) => s + e.net, 0);
  const expVat = expense.reduce((s, e) => s + e.vat, 0);
  const paidInGross = income.filter(e => e.paid).reduce((s, e) => s + e.net + e.vat, 0);
  const paidOutGross = expense.filter(e => e.paid).reduce((s, e) => s + e.net + e.vat, 0);
  const pendingIn = income.filter(e => !e.paid).reduce((s, e) => s + e.net + e.vat, 0);
  const pendingOut = expense.filter(e => !e.paid).reduce((s, e) => s + e.net + e.vat, 0);
  return { incNet, incVat, expNet, expVat, profit: incNet - expNet, vatBalance: incVat - expVat, cashFlow: paidInGross - paidOutGross, pendingIn, pendingOut };
}

function statBarHTML(stats) {
  const cards = [
    { label: "Κέρδος / Ζημιά", value: `${stats.profit >= 0 ? "+" : ""}${fmt(stats.profit)} €`, tone: stats.profit >= 0 ? "pos" : "neg", sub: "έσοδα − έξοδα (καθαρά)" },
    { label: "Ισοζύγιο ΦΠΑ", value: `${stats.vatBalance >= 0 ? "+" : ""}${fmt(stats.vatBalance)} €`, tone: stats.vatBalance >= 0 ? "pos" : "neg", sub: stats.vatBalance >= 0 ? "ΦΠΑ εισπρακτέο" : "ΦΠΑ πληρωτέο" },
    { label: "Ταμειακή ροή", value: `${stats.cashFlow >= 0 ? "+" : ""}${fmt(stats.cashFlow)} €`, tone: stats.cashFlow >= 0 ? "pos" : "neg", sub: "εξοφλημένα έσοδα − έξοδα" },
    { label: "Εκκρεμότητες", value: `${fmt(stats.pendingIn)} € / ${fmt(stats.pendingOut)} €`, tone: "neutral", sub: "προς είσπραξη / προς πληρωμή" }
  ];
  return `<div id="statBar">${cards.map(c => `
    <div class="stat-card">
      <div class="row"><span class="label">${c.label}</span></div>
      <div class="disp num value ${c.tone}">${c.value}</div>
      <div class="foot">${c.sub}</div>
    </div>`).join("")}</div>`;
}

function monthlyBreakdown(list) {
  const byMonth = {};
  list.forEach(e => {
    const ym = e.date.slice(0, 7);
    if (!byMonth[ym]) byMonth[ym] = { income: 0, expense: 0 };
    byMonth[ym][e.type] += e.net + e.vat;
  });
  const months = Object.keys(byMonth).sort();
  return { months, data: byMonth };
}

function destroyCharts() {
  Object.values(charts).forEach(c => c && c.destroy());
  charts = {};
}

function projectSortKey(name) {
  const m = (name || "").match(/^(\d+)/);
  return { num: m ? parseInt(m[1], 10) : Infinity, name: name || "" };
}
function compareProjects(a, b) {
  const ka = projectSortKey(a.name), kb = projectSortKey(b.name);
  if (ka.num !== kb.num) return ka.num - kb.num;
  return ka.name.localeCompare(kb.name, "el");
}

function drawMonthlyChart(canvasId, months, data) {
  const el = document.getElementById(canvasId);
  if (!el) return;
  if (typeof Chart === "undefined") {
    const ctx = el.getContext("2d");
    ctx.fillStyle = "#A6402C";
    ctx.font = "13px IBM Plex Sans";
    ctx.fillText("Το γράφημα δεν φόρτωσε (πρόβλημα δικτύου). Δοκίμασε ανανέωση.", 10, 30);
    return;
  }
  if (months.length === 0) {
    const ctx = el.getContext("2d");
    ctx.fillStyle = "#8A8676";
    ctx.font = "13px IBM Plex Sans";
    ctx.fillText("Δεν υπάρχουν ακόμη δεδομένα.", 10, 30);
    return;
  }
  charts[canvasId] = new Chart(el, {
    type: "bar",
    data: {
      labels: months.map(fmtMonth),
      datasets: [
        { label: "Έσοδα", data: months.map(m => data[m].income || 0), backgroundColor: "#2F6B4F" },
        { label: "Έξοδα", data: months.map(m => data[m].expense || 0), backgroundColor: "#C1571F" }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: "bottom", labels: { font: { family: "IBM Plex Sans", size: 12 }, color: "#221F1A" } } },
      scales: {
        x: { ticks: { color: "#6E6A5F", font: { size: 11 } }, grid: { display: false } },
        y: { ticks: { color: "#6E6A5F", font: { size: 11 } }, grid: { color: "#E5E1D5" } }
      }
    }
  });
}

function drawByProjectChart(canvasId) {
  const el = document.getElementById(canvasId);
  if (!el) return;
  if (typeof Chart === "undefined") {
    const ctx = el.getContext("2d");
    ctx.fillStyle = "#A6402C";
    ctx.font = "13px IBM Plex Sans";
    ctx.fillText("Το γράφημα δεν φόρτωσε (πρόβλημα δικτύου). Δοκίμασε ανανέωση.", 10, 30);
    return;
  }
  if (projects.length === 0) {
    const ctx = el.getContext("2d");
    ctx.fillStyle = "#8A8676";
    ctx.font = "13px IBM Plex Sans";
    ctx.fillText("Δεν υπάρχουν ακόμη έργα.", 10, 30);
    return;
  }
  const sortedProjects = projects.slice().sort(compareProjects);
  const labels = sortedProjects.map(p => p.name);
  const values = sortedProjects.map(p => computeStats(entries.filter(e => e.projectId === p.id)).profit);
  charts[canvasId] = new Chart(el, {
    type: "bar",
    data: { labels, datasets: [{ label: "Κέρδος / ζημιά", data: values, backgroundColor: values.map(v => v >= 0 ? "#2F6B4F" : "#A6402C") }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#6E6A5F", font: { size: 11 } }, grid: { display: false } },
        y: { ticks: { color: "#6E6A5F", font: { size: 11 } }, grid: { color: "#E5E1D5" } }
      }
    }
  });
}

function supplierBreakdownHTML(list) {
  const expenses = list.filter(e => e.type === "expense" && e.supplier && e.supplier.trim() !== "");
  if (expenses.length === 0) return "";
  const bySupplier = {};
  expenses.forEach(e => {
    const key = e.supplier.trim();
    if (!bySupplier[key]) bySupplier[key] = { count: 0, net: 0, vat: 0, unpaid: 0 };
    bySupplier[key].count += 1;
    bySupplier[key].net += e.net;
    bySupplier[key].vat += e.vat;
    if (!e.paid) bySupplier[key].unpaid += 1;
  });
  let suppliers = Object.keys(bySupplier).sort((a, b) => (bySupplier[b].net + bySupplier[b].vat) - (bySupplier[a].net + bySupplier[a].vat));
  if (supplierSearch.trim()) {
    const q = supplierSearch.trim().toLowerCase();
    suppliers = suppliers.filter(s => s.toLowerCase().includes(q));
  }
  return `
    <div class="chart-section">
      <div class="chart-title">Προμηθευτές</div>
      <div class="filter-row2">
        <input class="filter-input" id="supplierSearchInput" type="text" placeholder="Αναζήτηση προμηθευτή…" value="${escapeHTML(supplierSearch)}" style="min-width:200px;">
      </div>
      ${suppliers.length === 0 ? `<div class="empty-table">Δεν βρέθηκαν προμηθευτές.</div>` : `
      <div id="entriesWrap">
        <table>
          <thead><tr><th>Προμηθευτής</th><th class="right">Τιμολόγια</th><th class="right">Καθαρή αξία</th><th class="right">ΦΠΑ</th><th class="right">Σύνολο</th><th class="right">Εκκρεμή</th></tr></thead>
          <tbody>
            ${suppliers.map(s => `
              <tr>
                <td class="desc-main">${escapeHTML(s)}</td>
                <td class="num right">${bySupplier[s].count}</td>
                <td class="num right">${fmt(bySupplier[s].net)} €</td>
                <td class="num right" style="color:#8A8676;">${fmt(bySupplier[s].vat)} €</td>
                <td class="num right amt-neg">${fmt(bySupplier[s].net + bySupplier[s].vat)} €</td>
                <td class="num right" style="color:${bySupplier[s].unpaid > 0 ? "#8A6D1E" : "#8A8676"};">${bySupplier[s].unpaid}</td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>`}
    </div>`;
}

function vatRateLabel(e) {
  if (e.vatLines && e.vatLines.length > 1) {
    const rates = [...new Set(e.vatLines.map(l => l.rate))];
    return rates.map(r => r + "%").join("+");
  }
  return null;
}

function fmtBytes(bytes) {
  if (!bytes && bytes !== 0) return "";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}

function csvEscape(v) {
  const s = String(v ?? "");
  return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function exportProjectCSV(project, list) {
  const headers = ["Ημερομηνία", "Τύπος", "Περιγραφή", "Κατηγορία", "Προμηθευτής", "Αρ. Τιμολογίου", "Τρόπος πληρωμής", "Καθαρή αξία", "ΦΠΑ", "Σύνολο", "Κατάσταση"];
  const rows = list.slice().sort((a, b) => (a.date < b.date ? -1 : 1)).map(e => [
    fmtDate(e.date), e.type === "income" ? "Έσοδο" : "Έξοδο", e.description, e.category || "",
    e.supplier || "", e.invoiceNumber || "", e.paymentMethod || "",
    fmt(e.net), fmt(e.vat), fmt(e.net + e.vat), e.paid ? "Εξοφλήθηκε" : "Εκκρεμεί"
  ]);
  const csv = "﻿" + [headers, ...rows].map(r => r.map(csvEscape).join(";")).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${project.name.replace(/[^\p{L}\p{N}_\-]+/gu, "_")}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function createProject(project, contactRows, fieldRows) {
  const { data, error } = await supabase.from("projects").insert({
    name: project.name, address: project.address || null, start_date: project.startDate || null,
    end_date: project.endDate || null, status: project.status, client_vat: project.clientVat || null,
    contract_number: project.contractNumber || null, budget: project.budget
  }).select().single();
  if (error) { saveError = true; render(); return; }
  const newProject = mapProject(data);
  projects.push(newProject);
  activeProjectId = newProject.id;
  render();
  saveProjectContacts(newProject.id, contactRows);
  saveProjectFields(newProject.id, fieldRows);
}

async function updateProject(id, project, contactRows, fieldRows) {
  const { data, error } = await supabase.from("projects").update({
    name: project.name, address: project.address || null, start_date: project.startDate || null,
    end_date: project.endDate || null, status: project.status, client_vat: project.clientVat || null,
    contract_number: project.contractNumber || null, budget: project.budget
  }).eq("id", id).select().single();
  if (error) { saveError = true; render(); return; }
  projects = projects.map(p => p.id === id ? mapProject(data) : p);
  render();
  saveProjectContacts(id, contactRows);
  saveProjectFields(id, fieldRows);
}

async function saveProjectContacts(projectId, contactRows) {
  const validRows = contactRows.filter(c => c.name.trim());
  await supabase.from("project_contacts").delete().eq("project_id", projectId);
  contacts = contacts.filter(c => c.projectId !== projectId);
  if (validRows.length === 0) { render(); return; }
  const { data, error } = await supabase.from("project_contacts").insert(
    validRows.map(c => ({ project_id: projectId, name: c.name.trim(), role: c.role.trim() || null, phone: c.phone.trim() || null, email: c.email.trim() || null }))
  ).select();
  if (error) { saveError = true; render(); return; }
  data.forEach(d => contacts.push(mapContact(d)));
  render();
}

async function saveProjectFields(projectId, fieldRows) {
  const oldPaths = fields.filter(f => f.projectId === projectId && f.storagePath).map(f => f.storagePath);
  const validRows = fieldRows.filter(f => f.label.trim());

  for (const row of validRows) {
    if (row.removeFile) { row.storagePath = null; row.fileSize = null; }
    if (row.pendingFile) {
      const path = `${projectId}/${Date.now()}_${row.pendingFile.name.replace(/[\/\\]/g, "_")}`;
      const { error: uploadError } = await supabase.storage.from("project-files").upload(path, row.pendingFile);
      if (!uploadError) { row.storagePath = path; row.fileSize = row.pendingFile.size; }
    }
  }

  const keptPaths = new Set(validRows.map(f => f.storagePath).filter(Boolean));
  const pathsToDelete = oldPaths.filter(p => !keptPaths.has(p));
  if (pathsToDelete.length) await supabase.storage.from("project-files").remove(pathsToDelete);

  await supabase.from("project_fields").delete().eq("project_id", projectId);
  fields = fields.filter(f => f.projectId !== projectId);
  if (validRows.length === 0) { render(); return; }
  const { data, error } = await supabase.from("project_fields").insert(
    validRows.map((f, i) => ({
      project_id: projectId, label: f.label.trim(), value: f.value.trim() || null,
      storage_path: f.storagePath || null, file_size: f.fileSize || null, sort_order: i
    }))
  ).select();
  if (error) { saveError = true; render(); return; }
  data.forEach(d => fields.push(mapField(d)));
  render();
}

async function deleteProject(id) {
  const filesToRemove = fields.filter(f => f.projectId === id && f.storagePath).map(f => f.storagePath);
  const { error } = await supabase.from("projects").delete().eq("id", id);
  if (error) { saveError = true; render(); return; }
  projects = projects.filter(p => p.id !== id);
  entries = entries.filter(e => e.projectId !== id);
  contacts = contacts.filter(c => c.projectId !== id);
  fields = fields.filter(f => f.projectId !== id);
  if (activeProjectId === id) activeProjectId = projects.length ? projects[0].id : null;
  render();
  if (filesToRemove.length) await supabase.storage.from("project-files").remove(filesToRemove);
}

async function addEntries(entryList) {
  const rows = entryList.map(entry => ({
    project_id: entry.projectId, type: entry.type, date: entry.date, description: entry.description,
    category: entry.category, net: entry.net, vat_rate: entry.vatRate, vat: entry.vat, supplier: entry.supplier || null,
    invoice_number: entry.invoiceNumber, paid: entry.paid, paid_date: entry.paidDate || null,
    payment_method: entry.paymentMethod || null, split_group_id: entry.splitGroupId || null,
    split_percent: entry.splitPercent !== null && entry.splitPercent !== undefined ? entry.splitPercent : null,
    vat_lines: entry.vatLines || null, expense_scope: "project",
    tags: entry.tags && entry.tags.length ? entry.tags : null
  }));
  const { data, error } = await supabase.from("entries").insert(rows).select();
  if (error) { saveError = true; render(); return; }
  data.forEach(d => entries.push(mapEntry(d)));
  render();
}

async function deleteEntry(id) {
  const { error } = await supabase.from("entries").delete().eq("id", id);
  if (error) { saveError = true; render(); return; }
  entries = entries.filter(e => e.id !== id);
  render();
}

async function togglePaid(id) {
  const current = entries.find(e => e.id === id);
  const newPaid = !current.paid;
  const newPaidDate = newPaid ? todayISO() : null;
  const { error } = await supabase.from("entries").update({ paid: newPaid, paid_date: newPaidDate }).eq("id", id);
  if (error) { saveError = true; render(); return; }
  entries = entries.map(e => e.id === id ? { ...e, paid: newPaid, paidDate: newPaidDate } : e);
  render();
}

function openProjectModal(project) {
  editingProjectId = project ? project.id : null;
  document.getElementById("projectModalTitle").textContent = project ? "Στοιχεία έργου" : "Νέο έργο";
  document.getElementById("pjSubmit").textContent = project ? "Αποθήκευση αλλαγών" : "Δημιουργία έργου";
  document.getElementById("pjName").value = project ? project.name : "";
  document.getElementById("pjAddress").value = project ? (project.address || "") : "";
  document.getElementById("pjStartDate").value = project ? (project.startDate || "") : "";
  document.getElementById("pjEndDate").value = project ? (project.endDate || "") : "";
  document.getElementById("pjStatus").value = project ? project.status : "active";
  document.getElementById("pjClientVat").value = project ? (project.clientVat || "") : "";
  document.getElementById("pjContractNumber").value = project ? (project.contractNumber || "") : "";
  document.getElementById("pjBudget").value = project && project.budget ? project.budget : "";
  document.getElementById("pjError").style.display = "none";
  pjContactRows = project
    ? contacts.filter(c => c.projectId === project.id).map(c => ({ name: c.name, role: c.role || "", phone: c.phone || "", email: c.email || "" }))
    : [];
  renderContactRows();
  pjFieldRows = project
    ? fields.filter(f => f.projectId === project.id).map(f => ({
        label: f.label, value: f.value || "", storagePath: f.storagePath, fileSize: f.fileSize,
        pendingFile: null, removeFile: false
      }))
    : [];
  renderFieldRows();
  pjLocked = !!project;
  applyProjectLock();
  openModal("projectModalOverlay");
}

function applyProjectLock() {
  document.getElementById("pjLockField").style.display = editingProjectId ? "block" : "none";
  document.getElementById("pjLockBtn").classList.toggle("active", pjLocked);
  document.getElementById("pjEditBtn").classList.toggle("active", !pjLocked);
  const modalBody = document.querySelector("#projectModalOverlay .modal-body");
  modalBody.querySelectorAll("input, select, button").forEach(el => {
    if (el.id === "pjLockBtn" || el.id === "pjEditBtn") return;
    el.disabled = pjLocked;
  });
  document.getElementById("pjSubmit").style.display = pjLocked ? "none" : "block";
}

document.getElementById("pjLockBtn").addEventListener("click", () => { pjLocked = true; applyProjectLock(); });
document.getElementById("pjEditBtn").addEventListener("click", () => { pjLocked = false; applyProjectLock(); });

function renderContactRows() {
  const container = document.getElementById("pjContacts");
  container.innerHTML = pjContactRows.map((c, i) => `
    <div class="contact-row">
      <input class="contact-name" data-idx="${i}" placeholder="Όνομα" value="${escapeHTML(c.name)}">
      <input class="contact-role" data-idx="${i}" placeholder="Ρόλος (π.χ. Πελάτης)" value="${escapeHTML(c.role)}">
      <input class="contact-phone" data-idx="${i}" placeholder="Τηλέφωνο" value="${escapeHTML(c.phone)}">
      <input class="contact-email" data-idx="${i}" placeholder="Email" value="${escapeHTML(c.email)}">
      <button type="button" class="contact-remove" data-idx="${i}">&#10005;</button>
    </div>`).join("");
  container.querySelectorAll(".contact-name").forEach(inp => inp.addEventListener("input", (e) => { pjContactRows[+e.target.getAttribute("data-idx")].name = e.target.value; }));
  container.querySelectorAll(".contact-role").forEach(inp => inp.addEventListener("input", (e) => { pjContactRows[+e.target.getAttribute("data-idx")].role = e.target.value; }));
  container.querySelectorAll(".contact-phone").forEach(inp => inp.addEventListener("input", (e) => { pjContactRows[+e.target.getAttribute("data-idx")].phone = e.target.value; }));
  container.querySelectorAll(".contact-email").forEach(inp => inp.addEventListener("input", (e) => { pjContactRows[+e.target.getAttribute("data-idx")].email = e.target.value; }));
  container.querySelectorAll(".contact-remove").forEach(btn => btn.addEventListener("click", (e) => {
    pjContactRows.splice(+e.target.getAttribute("data-idx"), 1);
    renderContactRows();
  }));
}

document.getElementById("addContactBtn").addEventListener("click", () => {
  pjContactRows.push({ name: "", role: "", phone: "", email: "" });
  renderContactRows();
});

function renderFieldRows() {
  const container = document.getElementById("pjFields");
  container.innerHTML = pjFieldRows.map((f, i) => {
    const fileName = f.pendingFile ? f.pendingFile.name : (f.storagePath && !f.removeFile ? fileNameFromPath(f.storagePath) : null);
    const fileHref = (!f.pendingFile && f.storagePath && !f.removeFile)
      ? supabase.storage.from("project-files").getPublicUrl(f.storagePath).data.publicUrl
      : null;
    const fileTitle = f.pendingFile ? fmtBytes(f.pendingFile.size) : (f.fileSize ? fmtBytes(f.fileSize) : "");
    const fileControl = fileName
      ? `<span class="kv-file-chip">${fileHref ? `<a href="${fileHref}" target="_blank" rel="noopener" title="${fileTitle}">${escapeHTML(fileName)}</a>` : `<span title="${fileTitle}">${escapeHTML(fileName)}</span>`}<button type="button" class="field-file-remove" data-idx="${i}" title="Αφαίρεση αρχείου">&#10005;</button></span>`
      : `<button type="button" class="kv-file-attach" data-idx="${i}" title="Επισύναψη αρχείου">&#128206;</button>`;
    return `
    <div class="kv-row">
      <input class="field-label" data-idx="${i}" placeholder="Ονομασία (π.χ. Πολεοδομική Άδεια)" value="${escapeHTML(f.label)}">
      <input class="field-value" data-idx="${i}" placeholder="Τιμή (π.χ. Αρ. 123/2024)" value="${escapeHTML(f.value)}">
      <div>${fileControl}<input type="file" class="field-file-input" data-idx="${i}" style="display:none;"></div>
      <button type="button" class="contact-remove" data-idx="${i}">&#10005;</button>
    </div>`;
  }).join("");
  container.querySelectorAll(".field-label").forEach(inp => inp.addEventListener("input", (e) => { pjFieldRows[+e.target.getAttribute("data-idx")].label = e.target.value; }));
  container.querySelectorAll(".field-value").forEach(inp => inp.addEventListener("input", (e) => { pjFieldRows[+e.target.getAttribute("data-idx")].value = e.target.value; }));
  container.querySelectorAll(".kv-file-attach").forEach(btn => btn.addEventListener("click", (e) => {
    container.querySelector(`.field-file-input[data-idx="${e.currentTarget.getAttribute("data-idx")}"]`).click();
  }));
  container.querySelectorAll(".field-file-input").forEach(inp => inp.addEventListener("change", (e) => {
    const idx = +e.target.getAttribute("data-idx");
    if (e.target.files[0]) {
      pjFieldRows[idx].pendingFile = e.target.files[0];
      pjFieldRows[idx].removeFile = false;
      renderFieldRows();
    }
  }));
  container.querySelectorAll(".field-file-remove").forEach(btn => btn.addEventListener("click", (e) => {
    const idx = +e.currentTarget.getAttribute("data-idx");
    pjFieldRows[idx].pendingFile = null;
    pjFieldRows[idx].removeFile = true;
    renderFieldRows();
  }));
  container.querySelectorAll(".contact-remove").forEach(btn => btn.addEventListener("click", (e) => {
    pjFieldRows.splice(+e.target.getAttribute("data-idx"), 1);
    renderFieldRows();
  }));
}

document.getElementById("addFieldBtn").addEventListener("click", () => {
  pjFieldRows.push({ label: "", value: "", storagePath: null, fileSize: null, pendingFile: null, removeFile: false });
  renderFieldRows();
});

document.getElementById("pjSubmit").addEventListener("click", () => {
  const name = document.getElementById("pjName").value.trim();
  const address = document.getElementById("pjAddress").value.trim();
  const startDate = document.getElementById("pjStartDate").value;
  const endDate = document.getElementById("pjEndDate").value;
  const status = document.getElementById("pjStatus").value;
  const clientVat = document.getElementById("pjClientVat").value.trim();
  const contractNumber = document.getElementById("pjContractNumber").value.trim();
  const budget = document.getElementById("pjBudget").value;
  const errEl = document.getElementById("pjError");
  if (!name) { errEl.textContent = "Δώσε όνομα έργου."; errEl.style.display = "block"; return; }
  if (startDate && endDate && endDate < startDate) { errEl.textContent = "Η ημ/νία λήξης δεν μπορεί να είναι πριν την έναρξη."; errEl.style.display = "block"; return; }
  const projectData = { name, address, startDate, endDate, status, clientVat, contractNumber, budget: budget ? parseFloat(budget) : 0 };
  if (editingProjectId) {
    updateProject(editingProjectId, projectData, pjContactRows, pjFieldRows);
  } else {
    createProject(projectData, pjContactRows, pjFieldRows);
  }
  closeModal("projectModalOverlay");
});

function renderAllocations() {
  const container = document.getElementById("enProjectAllocations");
  container.innerHTML = allocations.map((a, i) => `
    <div class="alloc-row ${allocations.length > 1 ? "" : "single"}">
      <select class="alloc-project" data-idx="${i}">
        ${projects.slice().sort(compareProjects).map(p => `<option value="${p.id}" ${a.projectId === p.id ? "selected" : ""}>${escapeHTML(p.name)}</option>`).join("")}
      </select>
      <input class="alloc-percent" data-idx="${i}" type="number" min="0" max="100" step="0.1" value="${a.percent}">
      ${allocations.length > 1 ? `<button type="button" class="alloc-remove" data-idx="${i}">&#10005;</button>` : ""}
    </div>`).join("");
  container.querySelectorAll(".alloc-project").forEach(sel => {
    sel.addEventListener("change", (e) => {
      allocations[+e.target.getAttribute("data-idx")].projectId = e.target.value;
    });
  });
  container.querySelectorAll(".alloc-percent").forEach(inp => {
    inp.addEventListener("input", (e) => {
      allocations[+e.target.getAttribute("data-idx")].percent = e.target.value;
      updateAllocationRemaining();
    });
  });
  container.querySelectorAll(".alloc-remove").forEach(btn => {
    btn.addEventListener("click", (e) => {
      allocations.splice(+e.target.getAttribute("data-idx"), 1);
      renderAllocations();
      updateAllocationRemaining();
    });
  });
  updateAllocationRemaining();
}

function updateAllocationRemaining() {
  const el = document.getElementById("allocationRemaining");
  if (!el) return;
  const total = allocations.reduce((s, a) => s + (parseFloat(a.percent) || 0), 0);
  const remaining = Math.round((100 - total) * 10) / 10;
  if (Math.abs(remaining) < 0.05) {
    el.textContent = "✓ 100% κατανεμημένο";
    el.style.color = "#2F6B4F";
  } else if (remaining > 0) {
    el.textContent = `Υπόλοιπο προς κατανομή: ${remaining}%`;
    el.style.color = "#8A6D1E";
  } else {
    el.textContent = `Υπέρβαση κατά ${Math.abs(remaining)}%`;
    el.style.color = "#A6402C";
  }
}

document.getElementById("addAllocationBtn").addEventListener("click", () => {
  if (projects.length === 0) return;
  const total = allocations.reduce((s, a) => s + (parseFloat(a.percent) || 0), 0);
  const remaining = Math.max(0, Math.round((100 - total) * 10) / 10);
  const usedIds = allocations.map(a => a.projectId);
  const nextProject = projects.find(p => !usedIds.includes(p.id)) || projects[0];
  allocations.push({ projectId: nextProject.id, percent: remaining });
  renderAllocations();
});

function openEntryModal(type) {
  entryModalType = type;
  const isIncome = type === "income";
  document.getElementById("entryModalTitle").textContent = isIncome ? "Νέο έσοδο" : "Νέο έξοδο";
  const defaultProjectId = (activeProjectId && projects.some(p => p.id === activeProjectId)) ? activeProjectId : (projects[0] ? projects[0].id : "");
  allocations = defaultProjectId ? [{ projectId: defaultProjectId, percent: 100 }] : [];
  renderAllocations();
  document.getElementById("enDate").value = todayISO();
  document.getElementById("enDescription").value = "";
  entryTags = [];
  renderEntryTags();
  document.getElementById("enTagInput").value = "";
  const tagNames = [...new Set(entries.flatMap(e => e.tags || []))];
  document.getElementById("enTagList").innerHTML = tagNames.map(t => `<option value="${escapeHTML(t)}"></option>`).join("");
  document.getElementById("enSupplier").value = "";
  document.getElementById("enSupplierField").style.display = isIncome ? "none" : "block";
  const supplierNames = [...new Set(entries.filter(e => e.supplier).map(e => e.supplier))];
  document.getElementById("supplierList").innerHTML = supplierNames.map(s => `<option value="${escapeHTML(s)}"></option>`).join("");
  document.getElementById("enInvoice").value = "";
  const paymentSelect = document.getElementById("enPaymentMethod");
  paymentSelect.innerHTML = PAYMENT_METHODS.map(m => `<option value="${m}">${m}</option>`).join("");
  vatLines = [{ net: "", rate: 19 }];
  renderVatLines();
  document.getElementById("enPaid").checked = false;
  document.getElementById("enPaidLabel").textContent = isIncome ? "Έχει εισπραχθεί" : "Έχει πληρωθεί";
  document.getElementById("enError").style.display = "none";
  document.getElementById("enTotalPreview").textContent = "0,00 €";
  updateCategoryField();
  const submitBtn = document.getElementById("enSubmit");
  submitBtn.style.background = isIncome ? "#2F6B4F" : "#C1571F";
  submitBtn.textContent = `Αποθήκευση ${isIncome ? "εσόδου" : "εξόδου"}`;
  openModal("entryModalOverlay");
}

function renderEntryTags() {
  const wrap = document.getElementById("enTagsWrap");
  wrap.innerHTML = entryTags.map((t, i) => `
    <span class="tag-chip">${escapeHTML(t)}<button type="button" data-remove-tag="${i}">&#10005;</button></span>`).join("");
  wrap.querySelectorAll("[data-remove-tag]").forEach(btn => btn.addEventListener("click", () => {
    entryTags.splice(+btn.getAttribute("data-remove-tag"), 1);
    renderEntryTags();
  }));
}

function addEntryTag() {
  const input = document.getElementById("enTagInput");
  const value = input.value.trim();
  if (value && !entryTags.includes(value)) entryTags.push(value);
  input.value = "";
  renderEntryTags();
  input.focus();
}

document.getElementById("addTagBtn").addEventListener("click", addEntryTag);
document.getElementById("enTagInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); addEntryTag(); }
});

const NEW_CATEGORY_VALUE = "__new__";

function baseCategoriesFor(type) {
  if (type === "income") return CATEGORIES_INC;
  return CATEGORIES_EXP;
}

function updateCategoryField() {
  const selectEl = document.getElementById("enCategory");
  const newInputEl = document.getElementById("enCategoryNew");
  const base = baseCategoriesFor(entryModalType);
  const used = [...new Set(entries.filter(e => e.type === entryModalType && e.category).map(e => e.category))];
  const combined = [...new Set([...base, ...used])];
  selectEl.innerHTML = combined.map(c => `<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`).join("")
    + `<option value="${NEW_CATEGORY_VALUE}">+ Νέα κατηγορία…</option>`;
  selectEl.value = combined[0] || NEW_CATEGORY_VALUE;
  newInputEl.value = "";
  newInputEl.style.display = "none";
}

function selectedCategory() {
  const selectEl = document.getElementById("enCategory");
  if (selectEl.value === NEW_CATEGORY_VALUE) return document.getElementById("enCategoryNew").value.trim();
  return selectEl.value;
}

document.getElementById("enCategory").addEventListener("change", (e) => {
  const newInputEl = document.getElementById("enCategoryNew");
  if (e.target.value === NEW_CATEGORY_VALUE) {
    newInputEl.style.display = "block";
    newInputEl.focus();
  } else {
    newInputEl.style.display = "none";
  }
});

function renderVatLines() {
  const wrap = document.getElementById("vatLinesWrap");
  wrap.innerHTML = vatLines.map((line, i) => `
    <div class="vat-line-row" data-line-index="${i}">
      <input type="number" class="vat-line-net" placeholder="Καθαρή αξία €" value="${line.net}">
      <select class="vat-line-rate">
        ${VAT_RATE_OPTIONS.map(r => `<option value="${r}" ${line.rate === r ? "selected" : ""}>${r}%</option>`).join("")}
      </select>
      <button type="button" class="vat-line-remove" data-remove-line="${i}" ${vatLines.length <= 1 ? "style=\"visibility:hidden;\"" : ""}>&#10005;</button>
    </div>`).join("");

  wrap.querySelectorAll(".vat-line-row").forEach(row => {
    const idx = parseInt(row.getAttribute("data-line-index"), 10);
    row.querySelector(".vat-line-net").addEventListener("input", (e) => {
      vatLines[idx].net = e.target.value;
      updateTotalPreview();
    });
    row.querySelector(".vat-line-rate").addEventListener("change", (e) => {
      vatLines[idx].rate = parseFloat(e.target.value);
      updateTotalPreview();
    });
  });
  wrap.querySelectorAll("[data-remove-line]").forEach(btn => {
    btn.addEventListener("click", () => {
      const idx = parseInt(btn.getAttribute("data-remove-line"), 10);
      if (vatLines.length > 1) {
        vatLines.splice(idx, 1);
        renderVatLines();
        updateTotalPreview();
      }
    });
  });
  updateTotalPreview();
}

document.getElementById("addVatLineBtn").addEventListener("click", () => {
  vatLines.push({ net: "", rate: 19 });
  renderVatLines();
});

function computeVatLinesTotal() {
  let net = 0, vat = 0;
  vatLines.forEach(line => {
    const n = parseFloat(line.net) || 0;
    net += n;
    vat += n * line.rate / 100;
  });
  return { net, vat };
}

function updateTotalPreview() {
  const { net, vat } = computeVatLinesTotal();
  document.getElementById("enTotalPreview").textContent = fmt(net + vat) + " €";
}

document.getElementById("enSubmit").addEventListener("click", () => {
  const description = document.getElementById("enDescription").value.trim();
  const errEl = document.getElementById("enError");
  const isIncome = entryModalType === "income";
  if (allocations.length === 0) { errEl.textContent = "Δεν υπάρχει κανένα έργο. Δημιούργησε πρώτα ένα έργο."; errEl.style.display = "block"; return; }
  if (allocations.some(a => !a.projectId)) { errEl.textContent = "Επίλεξε έργο σε κάθε γραμμή."; errEl.style.display = "block"; return; }
  const totalPercent = allocations.reduce((s, a) => s + (parseFloat(a.percent) || 0), 0);
  if (Math.abs(totalPercent - 100) > 0.05) { errEl.textContent = `Τα ποσοστά πρέπει να αθροίζουν σε 100% (τώρα: ${Math.round(totalPercent * 10) / 10}%).`; errEl.style.display = "block"; return; }
  if (!description) { errEl.textContent = "Δώσε περιγραφή."; errEl.style.display = "block"; return; }
  const categoryCheck = selectedCategory();
  if (!categoryCheck) { errEl.textContent = "Δώσε κατηγορία."; errEl.style.display = "block"; return; }
  const validLines = vatLines.filter(l => (parseFloat(l.net) || 0) > 0);
  if (validLines.length === 0) { errEl.textContent = "Δώσε καθαρή αξία μεγαλύτερη από 0 σε τουλάχιστον μία γραμμή ΦΠΑ."; errEl.style.display = "block"; return; }
  const cleanLines = validLines.map(l => ({ net: Math.round((parseFloat(l.net) || 0) * 100) / 100, rate: l.rate, vat: Math.round(((parseFloat(l.net) || 0) * l.rate / 100 + Number.EPSILON) * 100) / 100 }));
  const { net, vat } = computeVatLinesTotal();
  const distinctRates = [...new Set(cleanLines.map(l => l.rate))];
  const vatRate = distinctRates.length === 1 ? distinctRates[0] : null;
  const paid = document.getElementById("enPaid").checked;
  const date = document.getElementById("enDate").value;
  const category = categoryCheck;
  const supplier = entryModalType === "expense" ? document.getElementById("enSupplier").value.trim() : "";
  const invoiceNumber = document.getElementById("enInvoice").value.trim();
  const paymentMethod = document.getElementById("enPaymentMethod").value;
  const paidDate = paid ? todayISO() : "";
  const leftoverTag = document.getElementById("enTagInput").value.trim();
  const tags = leftoverTag && !entryTags.includes(leftoverTag) ? [...entryTags, leftoverTag] : entryTags.slice();

  const isSplit = allocations.length > 1;
  const splitGroupId = isSplit ? ("split-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7)) : null;
  const entryList = allocations.map(a => {
    const pct = parseFloat(a.percent) || 0;
    const partNet = Math.round((net * pct / 100 + Number.EPSILON) * 100) / 100;
    const partVat = Math.round((vat * pct / 100 + Number.EPSILON) * 100) / 100;
    return {
      projectId: a.projectId, type: entryModalType, date, description, category, net: partNet, vat: partVat, vatRate,
      vatLines: cleanLines, supplier, invoiceNumber, paid, paidDate, paymentMethod,
      splitGroupId, splitPercent: isSplit ? pct : null, tags
    };
  });
  addEntries(entryList);
  closeModal("entryModalOverlay");
});

loadData();
</script>
</body>
